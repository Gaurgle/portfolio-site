name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'portfolio_FE/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'portfolio_FE/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'portfolio_FE/package-lock.json'
      - run: npm ci
      - run: npm run build
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-browser-check" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/portfolio-browser-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Check mobile Journey layout
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/portfolio-browser-check/node_modules/playwright" node scripts/check-journey.cjs
      - name: Upload dist (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: portfolio_FE/dist

      - name: Trigger Vercel deploy
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"